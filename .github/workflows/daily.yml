name: daily-mark
on:
  schedule:
    - cron: "15 12 * * 1-5"   # 17:45 IST every weekday, after NSE close
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas
      - run: python mark_daily.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add results book
          git diff --cached --quiet || git commit -m "mark $(date -u +%F)"
          git push
